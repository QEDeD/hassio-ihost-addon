name: "🐞 Bug Report"
description: "Report a bug in an iHost Home Assistant add-on."
title: "[Bug]: "
labels:
  - bug
  - needs-triage
body:
  - type: dropdown
    id: addon_name
    attributes:
      label: "Add-on Name"
      description: "Which add-on is affected?"
      options:
        - "-- Please select an add-on --"
        - "eWeLink Smart Home"
        - "eWeLink-Remote Gateway"
        - "SONOFF Dongle Flasher"
        - "iHost Hardware Control"
        - "Matter Bridge for iHost"
        - "Silicon Labs Multiprotocol"
        - "OpenThread Border Router"
        - "Node-RED"
        - "ESPHome Device Builder"
        - "Matter Server"
        - "Advanced SSH & Web Terminal"
        - "Zigbee2MQTT"
    validations:
      required: true


  - type: textarea
    id: environment
    attributes:
      label: "Environment"
      description: |
        Provide the versions, platform, radio, connection, and relevant add-on
        settings. Exact values help distinguish host, firmware, and lifecycle
        failures that otherwise produce similar logs.
      placeholder: |
        Add-on version:
        Home Assistant Core:
        Home Assistant Supervisor:
        Home Assistant OS:
        Host device and architecture:
        Radio model/chipset:
        Radio firmware and mode (RCP/NCP/Multi-PAN):
        Connection (USB/UART/TCP) and device/network_device:
        Backbone interface (configured or Supervisor-selected):
        Host IPv6 forwarding enabled:
        Baud rate:
        Hardware flow control:
        CPCd tracing:
        OTBR enabled:
        Firewall enabled:
        NAT64 enabled:
        Add-on restart recovers:
        Full host reboot recovers:
    validations:
      required: true

  - type: textarea
    id: problem_description
    attributes:
      label: "Problem Description"
      description: "What happened? What did you expect to happen?"
      placeholder: "Describe the issue clearly..."
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: "Logs"
      description: |
        Paste the full relevant logs here.
        You may also drag and drop log files directly into this field.
        The more complete the logs, the easier it is for us to diagnose the issue.
      placeholder: |
        Paste logs here, or drag and drop log files...
    validations:
      required: true


  - type: textarea
    id: reproduce_steps
    attributes:
      label: "Steps to Reproduce (Optional)"
      description: "If you can reproduce it, list the steps."
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: false

  - type: textarea
    id: screenshots
    attributes:
      label: "Screenshots (Optional)"
      description: "If applicable, add screenshots to help explain the problem. You can drag and drop images here."
      placeholder: |
        Drag and drop screenshots here, or paste images directly.
    validations:
      required: false
