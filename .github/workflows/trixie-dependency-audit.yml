name: Isolated Trixie and integrated AMD64 audit
on:
  workflow_dispatch:
    inputs:
      prepare_trial:
        description: Build guarded trial/baseline/recovery images and retain tested artifacts
        type: boolean
        default: false
  push:
    branches: [codex/trixie-dependency-audit-20260912, codex/otbr-integrated-20260913]
    paths:
      - .github/workflows/trixie-dependency-audit.yml
      - hassio-ihost-silabs-multiprotocol/Dockerfile
      - hassio-ihost-silabs-multiprotocol/build.yaml
      - hassio-ihost-silabs-multiprotocol/otbr-patches/**
      - hassio-ihost-silabs-multiprotocol/zigbeed-patches/**
      - hassio-ihost-silabs-multiprotocol/tests/**
      - hassio-ihost-silabs-multiprotocol/rootfs/**
      - tests/qr/**
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  inventory-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      AUDIT_FIXTURE_SOURCE: ${{ github.ref_name == 'codex/otbr-integrated-20260913' && 'current' || 'pinned' }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Require integration source for trial packaging
        if: inputs.prepare_trial
        run: test "$AUDIT_FIXTURE_SOURCE" = current
      - name: Inventory pinned images and build complete AMD64 checkout
        shell: bash
        run: |
          export AUDIT_BUILD_RECORD="$RUNNER_TEMP/trixie-build-record"
          printf 'AUDIT_BUILD_RECORD=%s\n' "$AUDIT_BUILD_RECORD" >> "$GITHUB_ENV"
          audit=hassio-ihost-silabs-multiprotocol/tests/trixie-audit
          bash -n "$audit/run.sh"
          bash -n "$audit/inventory.sh"
          bash -n "$audit/runtime.sh"
          shellcheck -x -P SCRIPTDIR "$audit/run.sh" "$audit/inventory.sh" "$audit/runtime.sh"
          python3 -m py_compile "$audit/prepare.py"
          bash "$audit/run.sh"
      - name: Obtain reviewed local trial packaging helper
        if: inputs.prepare_trial
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          repository: QEDeD/hassio-ihost-addon
          ref: 391bb7c56e01ef34ae5ae0b8cd259f31fdb7d6d0
          path: audit-trial-helper
          persist-credentials: false
      - name: Package exact images and rehearse synthetic state continuity
        if: inputs.prepare_trial
        timeout-minutes: 12
        run: |
          script=hassio-ihost-silabs-multiprotocol/tests/trial-package/prepare.sh
          bash -n "$script"
          shellcheck "$script"
          bash "$script" audit-trial-helper/hassio-ihost-silabs-multiprotocol/tools/local-service
      - name: Obtain pinned NAT64 and firewall regression fixtures
        if: env.AUDIT_FIXTURE_SOURCE == 'pinned'
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          repository: QEDeD/hassio-ihost-addon
          ref: 56a5e45fcdbac0b3b78c6d2898a34c2a9fe8d741
          path: audit-fixtures-nat64
          persist-credentials: false
      - name: Obtain pinned Zigbee readiness regression fixtures
        if: env.AUDIT_FIXTURE_SOURCE == 'pinned'
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          repository: QEDeD/hassio-ihost-addon
          ref: 9536ef0ff85d91a1a08e03b03bd91f2c2cd23225
          path: audit-fixtures-readiness
          persist-credentials: false
      - name: Exercise upgraded runtime with existing isolated regressions
        timeout-minutes: 15
        run: bash hassio-ihost-silabs-multiprotocol/tests/trixie-audit/runtime.sh
      - name: Extract and check combined-image commissioning frontend
        if: env.AUDIT_FIXTURE_SOURCE == 'current'
        shell: bash
        run: |
          set -euo pipefail
          container=$(docker create --network none local/ihost-trixie-audit)
          trap 'docker rm "$container" >/dev/null' EXIT
          frontend="$RUNNER_TEMP/combined-frontend"
          docker cp "$container:/usr/share/otbr-web/frontend" "$frontend"
          node tests/qr/check.cjs "$frontend" "$frontend/res/js/qrcode.js"
          test -f "$frontend/res/js/qrcode.LICENSE.txt"
      - name: Install browser test tools
        if: env.AUDIT_FIXTURE_SOURCE == 'current'
        run: npm --prefix "$RUNNER_TEMP/qr-tools" install --ignore-scripts --no-audit --no-fund @playwright/cli@0.1.19 jsqr@1.4.0
      - name: Check combined-image QR assets with synthetic commissioning data
        if: env.AUDIT_FIXTURE_SOURCE == 'current'
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          cli="$RUNNER_TEMP/qr-tools/node_modules/.bin/playwright-cli"
          node tests/qr/serve.cjs \
            "$RUNNER_TEMP/combined-frontend" \
            "$RUNNER_TEMP/qr-tools/node_modules/jsqr/dist/jsQR.js" &
          server_pid=$!
          trap '"$cli" -s=qr-ci close || true; kill "$server_pid" || true' EXIT
          for _attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:18764/ >/dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:18764/ >/dev/null
          "$cli" -s=qr-ci open http://127.0.0.1:18764 --browser chrome
          "$cli" -s=qr-ci run-code --filename tests/qr/browser-check.js
      - name: Export only successfully tested images and package metadata
        if: inputs.prepare_trial
        timeout-minutes: 8
        shell: bash
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/otbr-trial-package"
          timeout --kill-after=10s 360s docker save local/otbr-trial-candidate:ci \
            local/otbr-trial-baseline:ci local/otbr-trial-recovery:ci | gzip -1 > "$output/images.tar.gz"
          cd "$output"
          sha256sum images.tar.gz > images.tar.gz.sha256
      - name: Retain trial artifacts without publishing a release
        if: inputs.prepare_trial
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: otbr-trial-${{ github.sha }}
          path: ${{ runner.temp }}/otbr-trial-package/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
